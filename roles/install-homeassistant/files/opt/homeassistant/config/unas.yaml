views:
  - type: sections
    sections:
      - type: grid
        cards:
          - type: heading
            heading_style: title
            heading: UNAS-2
            badges:
              - type: entity
                show_state: true
                show_icon: true
                entity: sensor.unas_2_fan_speed_pwm
                color: blue
                tap_action:
                  action: more-info
              - type: entity
                show_state: true
                show_icon: true
                entity: sensor.unas_2_cpu_temperature
                color: orange
                tap_action:
                  action: more-info
              - type: entity
                show_state: true
                show_icon: true
                entity: sensor.unas_2_cpu_usage
                color: orange
                icon: mdi:cpu-64-bit
                tap_action:
                  action: more-info
              - type: entity
                show_state: true
                show_icon: true
                entity: sensor.unas_2_memory_used
                color: blue
                icon: mdi:memory
                tap_action:
                  action: more-info
          - type: custom:mushroom-select-card
            entity: select.unas_2_fan_mode
            primary_info: name
            secondary_info: last-updated
          - type: custom:mushroom-number-card
            entity: number.unas_2_fan_speed
            fill_container: false
            icon: mdi:fan
            display_mode: slider
            name: Fan Speed
            card_mod:
              style:
                mushroom-number-value-control$: |
                  :host {
                    {% if is_state('switch.unas_fan_auto_mode', 'on') %}
                      pointer-events: none;
                      opacity: 0.6;
                    {% endif %}
                  }
          - type: tile
            entity: sensor.unas_2_disk_read
            name: Read
            icon: mdi:upload
            color: green
            vertical: false
            features_position: bottom
          - type: tile
            entity: sensor.unas_2_disk_write
            name: Write
            icon: mdi:download
            color: red
            vertical: false
            features_position: bottom
          - graph: line
            type: sensor
            entity: sensor.unas_2_storage_pool_1_used
            name: Used
            detail: 1
            hours_to_show: 48
          - graph: line
            type: sensor
            entity: sensor.unas_2_storage_pool_1_available
            name: Available
            detail: 1
            hours_to_show: 48
