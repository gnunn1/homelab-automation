          - type: heading
            heading: Storage Pool 1
            heading_style: title
            badges:
              - type: entity
                show_state: true
                show_icon: true
                entity: sensor.unas_2_storage_pool_1_usage
                color: cyan
                tap_action:
                  action: more-info
                icon: mdi:harddisk
              - type: entity
                show_state: true
                show_icon: true
                color: cyan
                entity: sensor.unas_2_storage_pool_1_used
                tap_action:
                  action: more-info
          - type: heading
            icon: mdi:harddisk
            heading: Drive 1
            heading_style: subtitle
            badges:
              - type: entity
                show_state: true
                show_icon: true
                entity: sensor.unas_2_hdd_1_temperature
                color: orange
                tap_action:
                  action: more-info
                icon: mdi:thermometer
              - type: entity
                show_state: true
                show_icon: true
                entity: sensor.unas_2_hdd_1_status
                color: green
                tap_action:
                  action: more-info
                style: |
                  :host {
                    --icon-color: {% if is_state('sensor.unas_2_hdd_1_status', 'Optimal') %}var(--green-color){% else %}var(--red-color){% endif %} !important;
                  }
              - type: entity
                show_state: true
                show_icon: true
                entity: sensor.unas_2_hdd_1_power_on_hours
                color: cyan
                tap_action:
                  action: more-info
              - type: entity
                entity: sensor.unas_2_hdd_1_bad_sectors
            card_mod:
              style: |
                hui-heading-badge:nth-child(2) {
                  min-width: 71px !important;
                }
                hui-heading-badge:nth-child(3) {
                  min-width: 63px !important;
                }
          - type: heading
            icon: mdi:harddisk
            heading: Drive 2
            heading_style: subtitle
            badges:
              - type: entity
                show_state: true
                show_icon: true
                entity: sensor.unas_2_hdd_2_temperature
                color: orange
                tap_action:
                  action: more-info
                icon: mdi:thermometer
              - type: entity
                show_state: true
                show_icon: true
                entity: sensor.unas_2_hdd_2_status
                color: green
                tap_action:
                  action: more-info
                style: |
                  :host {
                    --icon-color: {% if is_state('sensor.unas_2_hdd_2_status', 'Optimal') %}var(--green-color){% else %}var(--red-color){% endif %} !important;
                  }
              - type: entity
                show_state: true
                show_icon: true
                entity: sensor.unas_2_hdd_2_power_on_hours
                color: cyan
                tap_action:
                  action: more-info
              - type: entity
                entity: sensor.unas_2_hdd_2_bad_sectors
            card_mod:
              style: |
                hui-heading-badge:nth-child(2) {
                  min-width: 71px !important;
                }
                hui-heading-badge:nth-child(3) {
                  min-width: 63px !important;
                }
          - type: history-graph
            entities:
              - entity: sensor.unas_2_hdd_1_temperature
                name: HDD1
              - entity: sensor.unas_2_hdd_2_temperature
                name: HDD2
            logarithmic_scale: false
            hours_to_show: 12
            max_y_axis: 52
